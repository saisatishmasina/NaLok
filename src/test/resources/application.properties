# Test configuration: disposable database ONLY. Committed with placeholders —
# DB_USERNAME/DB_PASSWORD are resolved from the environment at runtime (user
# provides them via .env). Never put real credentials in this file.
spring.application.name=nalok-test

spring.datasource.url=jdbc:mysql://localhost:3306/nalok_opencode_test?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
